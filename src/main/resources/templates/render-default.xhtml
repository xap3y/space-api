<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image - render</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
        body {
            background-color: rgb(21, 21, 21);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        input[type="text"] {
            width: 200px;
            height: 40px;
            border: 2px solid #555;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 18px;
            outline: none;
            text-align: center;
            color: white;
            background-color: rgb(40, 40, 40);
        }
        input[type="text"]:focus {
            border-color: #888;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background-color: #555;
            color: white;
        }
        button:hover {
            background-color: #888;
        }
    </style>
</head>
<body>
<!--<a th:text="'Uploaded by ' + ${uploader}" href="/">Uploaded by ..</a>-->

<div class="container">
    <input type="text" id="uniqueIdInput" maxlength="8" placeholder="Enter image ID" />
    <br />
    <button onclick="redirect()">Render</button>
</div>
<script>
    function redirect() {
        const input = document.getElementById('uniqueIdInput');
        if (input.value.length === 8) {
            window.location.href = "https://call.xap3y.tech/web/image-render/" + input.value;
        } else {
            alert('Please enter a valid image ID');
        }
    }
</script>
</body>
</html>
