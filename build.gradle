plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    //id "net.kyori.blossom" version "2.1.0"
}

group = 'me.xap3y'
version = '1.0-beta.31'

def otlpEndpoint = 'http://0.0.0.0:4317'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'net.coobird:thumbnailator:0.4.21'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.telegram:telegrambots-longpolling:9.5.0'
    implementation 'org.telegram:telegrambots-client:8.3.0'
    implementation 'com.discord4j:discord4j-core:3.3.2'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation "com.github.junrar:junrar:7.5.8"
    implementation 'software.amazon.awssdk:s3:2.33.8'
    implementation 'com.github.gotson.nightmonkeys:imageio-heif:1.1.0'
    implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.13.1'
    implementation 'io.micrometer:micrometer-core:1.17.0-M3'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.17.0-M3'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel:1.7.0-M4'
    implementation 'com.github.loki4j:loki-logback-appender:2.0.3'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.17.0'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.assertj:assertj-core:4.0.0-M1'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
/*

sourceSets {
    main {
        blossom {
            javaSources {
                property("version", version.toString())
            }
        }
    }
}*/

bootRun {
    jvmArgs = [
            "-javaagent:${projectDir}/opentelemetry-javaagent.jar",
            "-Dotel.service.name=space",
            "-Dotel.exporter.otlp.endpoint=${otlpEndpoint}",
            "-Dotel.exporter.otlp.protocol=grpc",
            "-Dotel.metrics.exporter=none",
            "-Dotel.logs.exporter=none",
            "-Dotel.instrumentation.logging.mdcs.enabled=true",
            "-Dotel.log.level=warn"
    ]
}
